<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<title>Bookings – Admin</title></head>
<body data-admin="bookings">
<div class="app admin"><div class="admin-shell">
  <main class="admin-main">
    <div class="admin-top"><div><h1>Bookings</h1><p>Confirm, cancel or edit any booking sent from the user side</p></div></div>
    <section class="panel">
      <table>
        <thead><tr><th>ID</th><th>User</th><th>Hotel</th><th>Nights</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
</div></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Edit Booking</h3>
    <div class="field"><label>Nights</label><input id="m-nights" type="number" min="1"></div>
    <div class="field"><label>Total ($)</label><input id="m-total" type="number" step="0.01"></div>
    <div class="acts"><button class="cancel" id="m-cancel">Cancel</button><button class="btn-gold" id="m-save">Save</button></div>
  </div>
</div>

<script src="js/store.js"></script><script src="js/admin-guard.js"></script><script src="js/admin-nav.js"></script><script src="js/admin-bookings.js"></script>
</body></html>
