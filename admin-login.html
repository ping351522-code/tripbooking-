<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/auth.css">
<title>Admin Login – LuxuryTrip</title></head>
<body><div class="app"><div class="auth-wrap">
  <div class="logo2"><b>LuxuryTrip <span style="color:var(--gold-3)">Admin</span></b></div>
  <div class="auth-card">
    <h1>Admin Login</h1><p class="sub">Staff access only. Demo: admin / admin123</p>
    <p class="err" id="err"></p>
    <form id="form">
      <div class="field"><label>Username</label><input type="text" id="username" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" required></div>
      <button class="btn-gold" type="submit">Log In</button>
    </form>
  </div>
</div></div>
<script src="js/store.js"></script><script src="js/admin-login.js"></script>
</body></html>
