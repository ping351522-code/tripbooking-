<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<title>Users – Admin</title></head>
<body data-admin="users">
<div class="app admin"><div class="admin-shell">
  <main class="admin-main">
    <div class="admin-top"><div><h1>Users</h1><p>Accounts created from the sign-up page appear here automatically</p></div></div>
    <section class="panel">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Balance</th><th>Points</th><th>Joined</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
</div></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Edit User</h3>
    <div class="field"><label>Name</label><input id="m-name" disabled></div>
    <div class="field"><label>Balance ($)</label><input id="m-balance" type="number" step="0.01"></div>
    <div class="field"><label>Points</label><input id="m-points" type="number"></div>
    <div class="field"><label>Status</label><select id="m-status"><option value="active">Active</option><option value="suspended">Suspended</option></select></div>
    <div class="acts"><button class="cancel" id="m-cancel">Cancel</button><button class="btn-gold" id="m-save">Save</button></div>
  </div>
</div>

<script src="js/store.js"></script><script src="js/admin-guard.js"></script><script src="js/admin-nav.js"></script><script src="js/admin-users.js"></script>
</body></html>
